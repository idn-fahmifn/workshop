<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>


        /*
        * untuk memanggil kelas => (.) titik
        * untuk memanggil id => (#) pagar
        * untuk memanggil tag => tanpa simbol
        */

        * {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .container {
            width: 100dvw;
            height: 100dvh;
            background-color: #ffe600;
        }

        .container h1{
            color: red;
        }

     

        .container-2 {
            width: 100dvw;
            height: 100dvh;
            background-color: #008899;
        }

        .title{
            color: #ffff;
        }

        .display {
            width: 100dvw;
            height: 100dvh;
        }

        .d-block{
            display: block;
            background: #ffe600;
        }

        .d-inline{
            display: inline;
            background: #445566;
            margin: 4px;
        }

        .area{
            width: 100%;
            height: 50%;
            background: #0088cc;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .img-title{
            width: 240px;
        }

        .ball{
            width: 100px;
            height: 100px;
            background-color: #ffe600;
            border-radius: 100%;
            animation: color 2s infinite alternate;
        }


        /* amimasi */

        @keyframes color {
            0%{
                background: #ffe600;
            }
            50%{
                background: #cc7400;
            }
            100%{
                background: #990000;
            }
        }

        
        
    </style>


</head>

<body>


    <div class="container" id="hero">
        <div class="title">
            Halloo
        </div>
        <h1>Hello saya sedang belajar WEB</h1>
    </div>

    <div class="container-2">
        <div class="title">
            Selamat sore
        </div>
        <h1>Saya belajar HTML dan CSS</h1>
    </div>


    <div class="display">
        <p class="d-block">
            Hello saya belajar web
        </p>
        <p class="d-block">
            Hello
        </p>

        <p class="d-inline">
            Hello saya belajar web
        </p>
        <p class="d-inline">
            Hello 
        </p>
        <p class="d-inline">
            Hello saya belajar web
        </p>
    </div>


    <!-- flexbox -->
     <div class="container">
        <div class="area">
            <div class="title">
                <h1>Selamat datang di web saya</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eaque, cumque!</p>
            </div>
            <div class="image">
                <img class="img-title" src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/640px-PNG_transparency_demonstration_1.png" alt="">
            </div>
        </div>
     </div>


     <div class="container">
        <div class="area">
            <div class="ball">

            </div>
        </div>
     </div>


</body>

</html>
