<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>


        /*
        * untuk memanggil kelas => (.) titik
        * untuk memanggil id => (#) pagar
        * untuk memanggil tag => tanpa simbol
        */

        * {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        #hero {
            width: 100dvw;
            height: 100dvh;
            background-color: #ffe600;
        }

        .container h1{
            color: red;
        }

        .container .title{
            color: #0088cc;
        }

        .container-2 {
            width: 100dvw;
            height: 100dvh;
            background-color: #008899;
        }

        .title{
            font-size: 2em;
            color: #ffff;
        }

        .display {
            width: 100dvw;
            height: 100dvh;
        }

        .d-block{
            display: block;
            background: #ffe600;
        }

        .d-inline{
            display: inline;
            background: #445566;
            margin: 4px;
        }
    </style>


</head>

<body>


    <div class="container" id="hero">
        <div class="title">
            Halloo
        </div>
        <h1>Hello saya sedang belajar WEB</h1>
    </div>

    <div class="container-2">
        <div class="title">
            Selamat sore
        </div>
        <h1>Saya belajar HTML dan CSS</h1>
    </div>


    <div class="display">
        <p class="d-block">
            Hello saya belajar web
        </p>
        <p class="d-block">
            Hello
        </p>

        <p class="d-inline">
            Hello saya belajar web
        </p>
        <p class="d-inline">
            Hello 
        </p>
        <p class="d-inline">
            Hello saya belajar web
        </p>
    </div>

</body>

</html>
